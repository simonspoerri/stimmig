# Postgres for local development. Each service gets its own database;
# scripts/create-databases.sh creates them (make setup / make dev).
name: stimmig
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15
volumes:
  postgres:
